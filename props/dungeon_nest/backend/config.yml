# Configuration for the Dungeon Nest prop

# --- BEHAVIOR ---
PLAY_DURATION: 300        # seconds the soundscape loops after the last motion (retrigger resets this)
WAIT_BETWEEN_PLAYS: 30    # cooldown seconds after a soundscape ends before re-arming
AUTO_ARM: false           # true = start armed (reacting to motion); false = start stopped until armed
SENSOR_POLL_INTERVAL: 1   # seconds between motion sensor polls
TELEMETRY_INTERVAL: 10    # seconds between telemetry updates

# --- HUE SETTINGS (motion sensors only, same as thriller_hue_nest) ---
HUE_BRIDGE_IP: "10.67.1.54"
MOTION_SENSORS:
  - "halloween"
  - "Hue outdoor motion sensor 1"
  - "Hue outdoor motion sensor 2"

# --- CHROMECAST SETTINGS ---
# Bare file names in `url` are resolved against MEDIA_BASE_URL (config/worker_host.env);
# full http(s):// URLs are used unchanged.
CHROMECAST_DUNGEON_GROUP:
  - name: "dungeon"
    IP: "10.67.1.253"
    url: "Halloween2023 - dungeon soundscape.mp3"
    volume: 0.9
    repeat: false
