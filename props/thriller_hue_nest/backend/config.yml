# Configuration for the Tesla/Hue/Nest Prop

# --- BEHAVIOR CONSTANTS ---
MOTION_TIMEOUT: 60        # how long to keep playing when no motion is registered
WAIT_BETWEEN_PLAYS: 30     # cooldown (seconds) after a show finishes, before the prop re-arms
TELEMETRY_INTERVAL: 10     # how often to send telemetry updates (seconds)

# --- HUE SETTINGS ---
HUE_BRIDGE_IP: "10.67.1.54"   # Hue bridge IP
HUE_SPOT_LIGHT: "Halloween Spot Greeter"
HUE_PLAYING_SCENE: "disco"  # Options: 'disco' or color ('red', 'yellow', 'pink', 'purple', 'normal', 'normal_lstr', 'dimmed')
MOTION_SENSORS:
  - "halloween"
  - "Hue outdoor motion sensor 1"
  - "Hue outdoor motion sensor 2"

# --- CHROMECAST SETTINGS ---
# Media server as seen from the speakers: IP of the PC running docker-compose.media.yml, port 8000.
# Bare file names in `url` are resolved against this; full http(s):// URLs are used unchanged.
CHROMECAST_THRILLER_GROUP:
  - name: "greeter"
    IP: "10.67.1.252"
    url: "Halloween soundtrack2023.mp3"
    volume: 0.9
    repeat: false

  - name: "bbq_skeleton"
    IP: "10.67.1.251"
    url: "Halloween soundtrack2023.mp3"
    volume: 0.9
    repeat: false



